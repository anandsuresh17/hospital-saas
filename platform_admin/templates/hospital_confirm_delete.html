
{% extends "base.html" %}

{% block title %}Deactivate Hospital | Super Admin{% endblock %}

{% block content %}

<h1>Deactivate Hospital</h1>

<p>
    Are you sure you want to deactivate
    <strong>{{ hospital.name }}</strong>?
</p>

<p>The hospital's records will remain safe in the database.</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Deactivate Hospital</button>

    <a href="{% url 'hospital_list' %}">Cancel</a>
</form>

{% endblock %}
