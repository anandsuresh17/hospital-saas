
{% extends "base.html" %}

{% block title %}Activate Template | Super Admin{% endblock %}

{% block content %}

<h1>Activate Hospital Template</h1>

<p>
    Are you sure you want to activate
    <strong>{{ template.name }}</strong>?
</p>

<p>This template will become available for new hospital assignments.</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Activate Template</button>

    <a href="{% url 'template_list' %}">Cancel</a>
</form>

{% endblock %}
